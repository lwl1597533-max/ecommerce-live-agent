<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>电商直播文案工作台</title>
<style>body{margin:0;background:#f3f6fa;color:#172438;font:16px/1.6 system-ui}main{max-width:1200px;margin:40px auto;padding:0 24px}h1{margin-bottom:0}small{color:#657388}.grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:24px}section{background:white;padding:24px;border-radius:16px;border:1px solid #dfe6ed}label{display:block;margin-top:14px}textarea,input,select,button{font:inherit;border-radius:8px;border:1px solid #bccada;padding:9px;box-sizing:border-box}textarea{width:100%;height:330px;font:14px/1.5 monospace}input{max-width:100%}button{cursor:pointer;background:#176b57;color:white;border:0;margin:12px 6px 0 0}button:disabled{opacity:.5}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit}.row{display:flex;gap:12px;flex-wrap:wrap}.badge{padding:8px 12px;background:#fff3cf;border-radius:8px;display:inline-block}#status{color:#985000}#question{width:100%}@media(max-width:800px){.grid{grid-template-columns:1fr}}</style>
<main><h1>电商直播文案工作台</h1><small>商品事实 → 核心卖点 → 直播话术 → 互动回复</small><p id="mode" class="badge">正在连接服务…</p>
<div class="grid"><section><h2>商品资料</h2><label>应用访问密钥（仅在配置 API_KEY 后需要）<input id="key" type="password" autocomplete="off"></label><label>样例商品 <select id="products"></select></label><label>商品 JSON<textarea id="product" spellcheck="false"></textarea></label>
<div class="row"><label>阶段 <select id="stage"><option value="opening">开场</option><option value="intro">产品介绍</option><option value="promote">促单</option><option value="close">收尾成交</option></select></label><label>风格 <select id="style"><option value="passionate">激情</option><option value="professional">专业</option><option value="humorous">幽默</option></select></label><label>时长（秒） <input id="duration" type="number" min="15" max="300" value="60" style="width:90px"></label></div>
<button id="load">加载样例</button><button id="extract">提取卖点</button><button id="generate">生成直播话术</button><p id="status" role="status"></p></section>
<section><h2>生成结果</h2><div id="points"></div><pre id="output">选择商品，开始生成。</pre><small id="metrics"></small><div><button id="good">有帮助 👍</button><button id="bad">需改进 👎</button></div><hr><h2>观众互动</h2><input id="question" placeholder="例如：这款多少钱？"><button id="ask">生成回复</button><pre id="reply"></pre></section></div></main>
<script>
const $=id=>document.getElementById(id);let samples=[],history=[],lastId=null,busy=false;
const headers=()=>({'Content-Type':'application/json','X-API-Key':$('key').value});
async function api(url,body){const r=await fetch(url,{method:body?'POST':'GET',headers:headers(),body:body?JSON.stringify(body):undefined});if(!r.ok)throw Error(await r.text());return r}
function product(){return JSON.parse($('product').value)}
function points(data){$('points').textContent=data.selling_points.map((p,i)=>`${i+1}. ${p.point}（依据：${p.evidence}）`).join('\n');$('points').style.whiteSpace='pre-wrap'}
async function action(fn){if(busy)return;busy=true;$('status').textContent='处理中…';document.querySelectorAll('button').forEach(b=>b.disabled=true);try{await fn();$('status').textContent='已完成'}catch(e){$('status').textContent='错误：'+e.message}finally{busy=false;document.querySelectorAll('button').forEach(b=>b.disabled=false)}}
function select(){const p=samples[Number($('products').value)];if(p)$('product').value=JSON.stringify(p,null,2);history=[];lastId=null}
$('products').onchange=select;
$('product').oninput=()=>{history=[];lastId=null};
$('load').onclick=()=>action(async()=>{samples=(await(await api('/api/products')).json()).products;$('products').replaceChildren(...samples.map((p,i)=>new Option(p.name,i)));select()});
$('extract').onclick=()=>action(async()=>points(await(await api('/api/extract/selling-points',product())).json()));
$('generate').onclick=()=>action(async()=>{lastId=null;$('output').textContent='';$('metrics').textContent='';const r=await api('/api/generate/script',{product:product(),script_type:$('stage').value,style:$('style').value,duration_seconds:Number($('duration').value),stream:true});const reader=r.body.getReader(),decoder=new TextDecoder();let buffer='',doneEvent=false;try{while(true){const {done,value}=await reader.read();buffer+=decoder.decode(value||new Uint8Array(),{stream:!done});let pos;while((pos=buffer.indexOf('\n\n'))>=0){const block=buffer.slice(0,pos);buffer=buffer.slice(pos+2);if(!block.startsWith('data: '))continue;const e=JSON.parse(block.slice(6));if(e.type==='selling_points')points(e.data);if(e.type==='token')$('output').textContent+=e.data;if(e.type==='error')throw Error(e.data.message);if(e.type==='done'){doneEvent=true;lastId=e.data.generation_id;$('metrics').textContent=`${e.data.word_count} 字 · ${e.data.elapsed_seconds} 秒 · ${e.data.duration_in_range?'时长符合目标':'长度偏离目标，可调整后重试'}`}}if(done)break}if(!doneEvent)throw Error('连接中断，结果不完整')}finally{await reader.cancel()}});
$('ask').onclick=()=>action(async()=>{const question=$('question').value;const data=await(await api('/api/interact/reply',{product:product(),question,context:history})).json();$('reply').textContent=data.reply+'\n意图：'+data.intent;history.push({question,reply:data.reply});history=history.slice(-10)});
for(const [id,rating]of [['good',1],['bad',-1]])$(id).onclick=()=>action(async()=>{if(!lastId)throw Error('请先生成完整话术');await api('/api/feedback',{generation_id:lastId,rating})});
fetch('/health').then(r=>r.json()).then(h=>{$('mode').textContent=h.backend==='demo'?'演示模式：规则模板生成，未连接真实大模型；时长控制仅供预览':'模型模式：'+h.model;$('load').click()}).catch(e=>$('status').textContent=e.message);
</script></html>
