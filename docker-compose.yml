services:
  api:
    build: .
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./runtime:/app/runtime
    depends_on:
      - redis
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    restart: unless-stopped
  vllm:
    profiles: [gpu]
    image: vllm/vllm-openai:v0.4.2
    command: --model Qwen/Qwen-7B-Chat --served-model-name Qwen/Qwen-7B-Chat --host 0.0.0.0 --port 8001 --dtype float16 --gpu-memory-utilization 0.85 --max-model-len 8192 --max-num-seqs 16 --trust-remote-code
    volumes:
      - model_cache:/root/.cache/huggingface
    ports:
      - "127.0.0.1:8001:8001"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
volumes:
  redis_data:
  model_cache:
